name = "andrewyao-app"
main = "build/index.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "andrewyao.app", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
