name = "andrewyao-app"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
routes = [{ pattern = "andrewyao.app", custom_domain = true }]

[build]
command = "PATH=.tools/bin:$PATH worker-build --release"

[assets]
directory = "public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
